<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Restoration · Open RotMG</title>
  <meta name="description" content="Restoration progress for Realm of the Mad God build 123.5.1, organized by player-facing features.">
  <link rel="canonical" href="{{SITE_URL}}restoration/">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="{{BASE}}amulet-of-resurrection.png">
  <link rel="stylesheet" href="{{BASE}}style.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body class="restoration-page">
<div class="site-shell">
  <main class="page-main">
    <a class="back" href="{{BASE}}">← Back to game</a>
    <div class="restoration-intro">
      <h1>Restoration</h1>
      <p class="progress-line"><span id="overall">{{RESTORATION_PERCENT}}</span> complete · 123.5.1</p>
      <p class="audit-summary"><strong>Implementation:</strong> <span id="implementation-summary">Loading...</span><br><strong>Historical verification:</strong> <span id="historical-summary">Loading...</span></p>
    </div>
    <nav id="areas" class="category-links" aria-label="Feature categories"></nav>
    <div id="features"></div>
    <p id="error" role="alert" hidden></p>
    <noscript>JavaScript is required to inspect the Restoration catalogue.</noscript>
  </main>
  <footer class="site-footer">
    <p class="site-signature"><img src="{{BASE}}amulet-of-resurrection.png" width="17" height="17" alt="">Open RotMG</p>
    <p>2012 Realm of the Mad God reimplementation<br>
    Report bugs and missing content on Discord.</p>
    <nav aria-label="Project">{{PROJECT_NAV}}</nav>
  </footer>
</div>
<dialog id="feature-dialog" aria-labelledby="feature-title">
  <div class="dialog-head"><div class="feature-heading"><img id="feature-icon" alt="" hidden><h2 id="feature-title"></h2></div><button id="feature-close" type="button" aria-label="Close feature details">Close</button></div>
  <p id="feature-status"></p>
  <div id="feature-audit"></div>
</dialog>
</body>
</html>
