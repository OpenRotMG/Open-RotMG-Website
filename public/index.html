<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="openrotmg-api" content="{{API_ORIGIN}}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' {{API_ORIGIN}} {{SOCKET_ORIGIN}}; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'">
  <script src="{{BASE}}backend.js" defer></script>
  <title>Open RotMG | 2012 Realm of the Mad God reconstruction</title>
  <meta name="description" content="Open RotMG is an open-source reconstruction of 2012 Realm of the Mad God, targeting build 123.5.1. Play the development build in your browser.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="{{SITE_URL}}">
  <link rel="icon" href="{{BASE}}amulet-of-resurrection.png" type="image/png">
  <link rel="stylesheet" href="{{BASE}}style.css">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Open RotMG","url":"{{SITE_URL}}","description":"An independent open-source reconstruction of Realm of the Mad God build 123.5.1 from 2012.","inLanguage":"en"}</script>
  <script src="{{BASE}}vendor/ruffle.js?v={{CLIENT_REVISION}}" defer></script>
  <script src="{{BASE}}diagnostics.js" defer></script>
  <script src="{{BASE}}game.js" defer></script>
</head>
<body class="game-page">
<div class="site-shell">
  <main class="page-main">
    <h1 class="screen-reader">Open RotMG</h1>
    <p class="alpha-warning" role="note">Open RotMG is in early alpha. Saves will be reset before Beta release.</p>
    <div id="game" data-mode="game" aria-label="Realm of the Mad God 123.5.1">
      <div id="startup" role="status">
        <img src="{{BASE}}amulet-of-resurrection.png" width="96" height="96" alt="">
        <strong>Open RotMG</strong>
        <span>Loading client…</span>
        <a href="https://ruffle.rs/">Powered by Ruffle</a>
      </div>
    </div>
    <noscript><p class="notice">JavaScript is required to load the preserved Flash client through Ruffle.</p></noscript>
    <p id="load-error" class="notice" role="alert" hidden></p>
  </main>
  <footer class="site-footer">
    <p class="site-signature"><img src="{{BASE}}amulet-of-resurrection.png" width="17" height="17" alt="">Open RotMG</p>
    <p>2012 Realm of the Mad God reimplementation<br>
    Report bugs and missing content on Discord.</p>
    <nav aria-label="Project">{{PROJECT_NAV}}</nav>
  </footer>
</div>
</body>
</html>
