<!doctype html>
<html lang="en">
<head>

  <link rel="canonical" href="{{SITE_URL}}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OpenRotMG">
  <meta property="og:title" content="OpenRotMG | Realm of the Mad God, 2012">

  <meta property="og:url" content="{{SITE_URL}}">
  <meta property="og:image" content="{{SITE_URL}}social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <script src="{{BASE}}game.js" defer></script>

<body class="game-page">
  <main>
    <h1 class="screen-reader">OpenRotMG client preview</h1>
    <div id="game" aria-label="Realm of the Mad God 123.5.1 client preview"></div>
    <noscript><p class="notice">JavaScript is required to load the preserved Flash client through Ruffle.</p></noscript>
    <p id="load-error" class="notice" role="alert" hidden></p>
  </main>
  <footer>
    <p>OpenRotMG targets Realm of the Mad God build 123.5.1 (2012). <strong>Multiplayer is not online yet.</strong></p>
    <nav aria-label="Project"><a href="{{BASE}}about/">About</a><a href="https://github.com/OpenRotMG/website">Source</a><a href="https://discord.gg/EwZWNzzYwP">Discord</a></nav>
  </footer>
