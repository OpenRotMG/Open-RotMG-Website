<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src {{API_ORIGIN}}; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Export save | Open RotMG</title>
  <meta name="description" content="Download your personal Open RotMG account progress for cross-server porting or singleplayer play.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="{{SITE_URL}}export/">
  <link rel="stylesheet" href="{{BASE}}style.css">
  <meta name="openrotmg-api" content="{{API_ORIGIN}}">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="style.css">
  <script src="{{BASE}}backend.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body class="about-page">
<div class="site-shell">
  <main class="page-main"><div class="about-copy">
    <h1>Export save</h1>
    <form id="export-form" autocomplete="off">
      <label for="email">Game email</label>
      <input id="email" type="email" autocomplete="off" maxlength="254" required>
      <label for="password">Game password</label>
      <input id="password" type="password" autocomplete="off" maxlength="128" required>
      <button type="submit" disabled>Download account save</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript><p>JavaScript is required to authenticate and download your save without putting credentials in a URL.</p></noscript>
    <h2>Using your save offline</h2>
    <p>See the <a href="{{BASE}}single-player/">Single Player</a> page.</p>
  </div></main>
  <footer class="site-footer">
    <p class="site-signature"><img src="{{BASE}}amulet-of-resurrection.png" width="17" height="17" alt="">Open RotMG</p>
    <p>2012 Realm of the Mad God reimplementation</p>
    <nav aria-label="Project">{{PROJECT_NAV}}</nav>
  </footer>
</div>
</body>
</html>
