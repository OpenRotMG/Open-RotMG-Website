name: Website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLIENT_DIR: ${{ github.workspace }}/client
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read pinned client revision
        id: client
        run: |
          revision=$(node -p "JSON.parse(require('fs').readFileSync('website/client-lock.json')).revision")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OpenRotMG/Open-RotMG-Client
          ref: ${{ steps.client.outputs.revision }}
          path: client
          persist-credentials: false
      - run: npm --prefix website test
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/dist
          include-hidden-files: true
