name: Website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLIENT_DIR: ${{ github.workspace }}/client
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read pinned client revision
        id: client
        run: |
          revision=$(node -p "JSON.parse(require('fs').readFileSync('website/tools/client-lock.json')).revision")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OpenRotMG/Open-RotMG-Client
          ref: ${{ steps.client.outputs.revision }}
          path: client
          persist-credentials: false
      - run: npm --prefix website test
      - run: python3 -B -m unittest discover -s website/tools -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/dist
          include-hidden-files: true
  deploy:
    if: github.repository == 'OpenRotMG/Open-RotMG-Website' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: website
          path: dist
      - run: python3 tools/package.py dist "$GITHUB_SHA" website.tar.gz
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: openrotmg-20261011
          workload_identity_provider: ${{ vars.WEBSITE_IDENTITY_PROVIDER }}
          service_account: ${{ vars.WEBSITE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Atomically publish and verify every public file
        env:
          DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.WEBSITE_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/website-key"
          hosts="$RUNNER_TEMP/website-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o HostKeyAlias=openrotmg-website -o ConnectTimeout=60 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o 'ProxyCommand=gcloud compute start-iap-tunnel openrotmg 22 --listen-on-stdin --zone=us-central1-a --project=openrotmg-20261011 --quiet' \
            openrotmg-website@openrotmg "$GITHUB_SHA" < website.tar.gz
