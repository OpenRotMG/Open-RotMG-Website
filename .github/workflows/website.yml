name: Website
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      client_ref:
        type: string
        required: true
    secrets:
      WEBSITE_DEPLOY_SSH_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.revisions.outputs.website }}
      client: ${{ steps.revisions.outputs.client }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLIENT_DIR: ${{ github.workspace }}/client
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OpenRotMG/Open-RotMG-Website
          ref: ${{ github.repository == 'OpenRotMG/Open-RotMG-Website' && github.sha || 'main' }}
          path: website
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: OpenRotMG/Open-RotMG-Client
          ref: ${{ inputs.client_ref || 'main' }}
          path: client
          persist-credentials: false
      - name: Record the exact source pair
        id: revisions
        run: |
          echo "website=$(git -C website rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "client=$(git -C client rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: python3 -B -m unittest discover -s client/tests -v
      - run: npm --prefix website test
      - run: python3 -B -m unittest discover -s website/tools -p 'test_*.py'
      - run: python3 website/tools/package.py website/dist client "${{ steps.revisions.outputs.website }}" website/website.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/website.tar.gz
          if-no-files-found: error
  deploy:
    if: (github.repository == 'OpenRotMG/Open-RotMG-Website' || github.repository == 'OpenRotMG/Open-RotMG-Client') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: website
          path: .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: openrotmg-20261011
          workload_identity_provider: ${{ vars.WEBSITE_IDENTITY_PROVIDER }}
          service_account: ${{ vars.WEBSITE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Publish matching website and client and verify public files
        env:
          WEBSITE_REVISION: ${{ needs.build.outputs.website }}
          CLIENT_REVISION: ${{ needs.build.outputs.client }}
          DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.WEBSITE_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/website-key"
          hosts="$RUNNER_TEMP/website-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o HostKeyAlias=openrotmg-website -o ConnectTimeout=60 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o 'ProxyCommand=gcloud compute start-iap-tunnel openrotmg 22 --listen-on-stdin --zone=us-central1-a --project=openrotmg-20261011 --quiet' \
            openrotmg-website@openrotmg "$WEBSITE_REVISION $CLIENT_REVISION" < website.tar.gz
