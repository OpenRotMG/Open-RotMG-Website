name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLIENT_DIR: ${{ github.workspace }}/client
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read pinned client revision
        id: client
        run: |
          revision=$(node -p "JSON.parse(require('fs').readFileSync('website/client-lock.json')).revision")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OpenRotMG/client
          ref: ${{ steps.client.outputs.revision }}
          path: client
          persist-credentials: false
      - run: npm --prefix website test
      - run: npm --prefix website run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4
        id: deployment
